import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath group: 'org.jetbrains.kotlin', name: 'kotlin-gradle-plugin', version: '1.9.25'
        classpath "org.jetbrains.dokka:dokka-gradle-plugin:1.9.20"
    }
}

plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

// Fixed: Group defined at root level so nexusPublishing can identify the staging profile
group = 'com.github.shynixn.mccoroutine'

allprojects {
    apply plugin: 'org.jetbrains.dokka'
}

repositories {
    mavenCentral()
    mavenLocal()
}

// Global configuration for publishing via Sonatype Central Portal API
nexusPublishing {
    repositories {
        sonatype {
            nexusUrl = uri("https://ossrh-staging-api.central.sonatype.com/service/local/")
            snapshotRepositoryUrl = uri("https://central.sonatype.com/repository/maven-snapshots/")

            packageGroup = "com.github.shynixn.mccoroutine"

            // Fallback to environment variables or properties for credentials
            username = project.findProperty("sonatypeUsername") ?: System.getenv("SONATYPE_USERNAME")
            password = project.findProperty("sonatypePassword") ?: System.getenv("SONATYPE_PASSWORD")
        }
    }
}

tasks.register("printVersion") {
    println(this.subprojects.getAt(0).version)
}

subprojects {
    group 'com.github.shynixn.mccoroutine'
    version '2.23.0'

    sourceCompatibility = 1.8

    apply plugin: 'kotlin'
    apply plugin: 'signing'
    apply plugin: 'maven-publish'
    apply plugin: 'java-library'

    compileKotlin {
        kotlinOptions.jvmTarget = "1.8"
    }
    compileTestKotlin {
        kotlinOptions.jvmTarget = "1.8"
    }

    test {
        useJUnitPlatform()
        testLogging.showStandardStreams = true
        failFast = true

        testLogging {
            events(TestLogEvent.FAILED, TestLogEvent.PASSED, TestLogEvent.SKIPPED, TestLogEvent.STARTED)
            displayGranularity = 0
            showExceptions = true
            showCauses = true
            showStackTraces = true
            exceptionFormat = TestExceptionFormat.FULL
        }
    }

    task sourcesJar(type: Jar) {
        from sourceSets.main.allSource
        getArchiveClassifier().set('sources')
    }

    tasks.named("dokkaHtml") {
        outputDirectory = file("$buildDir/javadoc")
    }

    task javadocJar(type: Jar, dependsOn: dokkaHtml) {
        from dokkaHtml.outputDirectory
        getArchiveClassifier().set('javadoc')
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifact sourcesJar
                artifact javadocJar
                pom {
                    name = 'MCCoroutine'
                    description = 'MCCoroutine is a library, which adds extensive support for Kotlin Coroutines for Minecraft Server environments.'
                    url = 'https://github.com/Shynixn/MCCoroutine'
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'http://www.opensource.org/licenses/mit-license.php'
                        }
                    }
                    developers {
                        developer {
                            name = 'Shynixn'
                            url = 'https://github.com/Shynixn'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/Shynixn/MCCoroutine.git'
                        developerConnection = 'scm:git:ssh://github.com:Shynixn/MCCoroutine.git'
                        url = 'http://github.com/Shynixn/MCCoroutine.git/tree/master'
                    }
                }
            }
        }
    }

    signing {
        sign publishing.publications.mavenJava
    }

    repositories {
        mavenCentral()
        mavenLocal()
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter-api:5.3.1'
        testImplementation 'org.mockito:mockito-core:5.14.2'
        testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.3.1'
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    if (project.findProperty("signing.keyId") == null) {
        ext."signing.keyId" = System.getenv('SIGNING_KEY_ID')
        ext."signing.password" = System.getenv('SIGNING_KEY_PASSWORD')
        ext."signing.secretKeyRingFile" = System.getenv('SIGNING_KEY_FILE')
    }
}

task generateBukkitJavaDocPages(type: org.jetbrains.dokka.gradle.DokkaTask) {
    dokkaSourceSets {
        named("main") {
            outputDirectory = file("docs/apidocs")
            sourceRoots.from(file("mccoroutine-bukkit-api/src/main/java"))
        }
    }
}

